<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodField オンライン版の利用条件</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <article class="startup-card">
        <h1>オンライン版の利用条件</h1>
        <ul>
          <li>2～9席の個人戦で、HumanとCPUを混在できます。</li>
          <li>隠れ乱闘への参加には、ホストと共有した部屋の合言葉が必要です。</li>
          <li>操作期限は15秒です。期限切れや切断後はCPUが代行します。</li>
          <li>未開始ルームは2時間、終了・失効した対戦データは24時間保持します。</li>
          <li>初期運用は単一リージョンです。障害時は新規操作を一時停止します。</li>
        </ul>
        <p>
          合言葉や再参加情報を公開のチャット、配信、画面共有へ載せないでください。
          接続障害時は同じブラウザから再読み込みしてください。
        </p>
        <p><a href="/">GoodFieldへ戻る</a></p>
      </article>
    </main>
  </body>
</html>
